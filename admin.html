<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无限画布 · 后台管理</title>
<style>
  :root{ --bg:#111113; --panel:#1c1c1f; --line:#2a2a2e; --line2:#3a3a40;
    --text:#e8e6e3; --text2:#9a9890; --text3:#5c5a55; --accent:#d4a853; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); font:14px/1.6 -apple-system, "Microsoft YaHei", sans-serif; min-height:100vh; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; margin-bottom:18px; }
  h1{ font-size:22px; text-align:center; margin-top:10px; letter-spacing:2px; }
  h2{ font-size:14px; font-weight:600; color:var(--text2); margin-bottom:14px; letter-spacing:1px; }
  .sub{ font-size:12px; color:var(--text3); text-align:center; margin-top:4px; }
  .logo{ font-size:46px; text-align:center; line-height:1;
    background:linear-gradient(135deg,#f0ece2,#cbb88b 55%,#94876c);
    -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; }
  .inp{ width:100%; background:#141416; border:1px solid var(--line2); border-radius:9px; color:var(--text);
    font-size:13.5px; padding:10px 13px; outline:none; margin-bottom:10px; box-sizing:border-box; }
  .inp:focus{ border-color:#c9a86a; }
  .btn{ background:#26262a; border:1px solid var(--line2); color:var(--text); padding:8px 16px;
    border-radius:8px; cursor:pointer; font-size:13px; transition:all .15s; }
  .btn:hover{ background:#2e2e33; }
  .btn.primary{ background:#e8d8b0; color:#16161a; border-color:transparent; font-weight:600; }
  .btn.primary:hover{ background:#f0e4c2; }
  .btn.sm{ padding:4px 10px; font-size:12px; }
  .btn.danger{ border-color:#5c2a35; color:#f87171; }
  .btn.danger:hover{ background:#3d1f2b; color:#ff8ba7; }
  .btn:disabled{ opacity:.6; cursor:default; }
  #login-panel{ max-width:360px; margin:12vh auto 0; padding:34px 34px 26px; }
  #login-panel .btn{ width:100%; margin-top:4px; }
  .msg{ min-height:20px; font-size:12.5px; color:#ff9aa3; margin-top:10px; text-align:center; }
  .back{ display:block; text-align:center; font-size:12px; color:var(--text3); margin-top:14px; text-decoration:none; }
  .back:hover{ color:var(--text2); }
  #admin-panel{ max-width:1080px; margin:0 auto; padding:24px 20px 60px; }
  .bar{ display:flex; align-items:center; justify-content:space-between; padding:14px 4px 20px; }
  .brand{ font-size:16px; font-weight:700; letter-spacing:1px; }
  .right{ display:flex; align-items:center; gap:12px; font-size:13px; color:var(--text2); }
  .stats{ display:flex; gap:14px; flex-wrap:wrap; }
  .st{ flex:1; min-width:150px; background:#141416; border:1px solid var(--line); border-radius:10px; padding:16px;
    display:flex; flex-direction:column; align-items:center; gap:4px; }
  .st b{ font-size:26px; color:#e8d8b0; }
  .st span{ font-size:12px; color:var(--text3); }
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .row .inp{ margin-bottom:0; }
  .row .inp:first-child{ flex:1; }
  .row .inp:nth-child(2){ flex:1.2; }
  .row .btn{ flex:none; }
  .tbl-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13px; min-width:780px; }
  th,td{ text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th{ color:var(--text3); font-weight:500; font-size:12px; }
  .num{ color:#e8d8b0; }
  .ulink{ color:#c9a86a; text-decoration:none; border-bottom:1px dashed rgba(201,168,106,.5); }
  .ulink:hover{ color:#e8d8b0; }
  .pw{ font-family:Consolas, monospace; color:#c9a86a; user-select:all; max-width:140px;
    overflow:hidden; text-overflow:ellipsis; display:inline-block; vertical-align:middle; }
  .pw:hover{ overflow:visible; }
  .tag{ font-size:11px; color:#e8d8b0; border:1px solid rgba(216,192,142,.4); border-radius:99px; padding:1px 7px; margin-left:6px; }
  .off{ color:#ff8ba7; }
  .ops{ white-space:nowrap; }
  .ops .btn{ margin-right:6px; }
  .hint{ font-size:11.5px; color:var(--text3); margin-top:10px; }
  /* ---------- 加积分弹窗 ---------- */
  .cm-mask{ position:fixed; inset:0; background:rgba(8,8,10,.6); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:999; padding:20px; }
  .cm-mask[hidden]{ display:none; }
  .cm-card{ width:340px; max-width:100%; background:linear-gradient(180deg,#202024,#19191c);
    border:1px solid #3a3a40; border-radius:16px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .cm-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cm-title{ font-size:16px; font-weight:700; letter-spacing:1px; color:#e8d8b0; }
  .cm-close{ background:none; border:none; color:var(--text3); font-size:20px; line-height:1; cursor:pointer; padding:0 4px; }
  .cm-close:hover{ color:var(--text); }
  .cm-user{ font-size:13px; color:var(--text2); margin-bottom:14px; }
  .cm-user b{ color:var(--text); }
  .cm-label{ display:block; font-size:12px; color:var(--text3); margin:12px 0 5px; }
  .cm-input{ width:100%; box-sizing:border-box; background:#141416; border:1px solid var(--line2);
    border-radius:9px; color:var(--text); font-size:14px; padding:11px 13px; outline:none; }
  .cm-input:focus{ border-color:#c9a86a; }
  .cm-err{ min-height:18px; font-size:12.5px; color:#ff8ba7; margin-top:10px; }
  .cm-actions{ display:flex; gap:10px; margin-top:16px; }
  .cm-btn{ flex:1; background:#26262a; border:1px solid var(--line2); color:var(--text);
    border-radius:9px; padding:11px; cursor:pointer; font-size:13.5px; transition:all .15s; }
  .cm-btn:hover{ background:#2e2e33; }
  .cm-btn.primary{ background:linear-gradient(135deg,#e8d8b0,#cbb88b); color:#16161a; border-color:transparent; font-weight:600; }
  .cm-btn.primary:hover{ background:linear-gradient(135deg,#f0e4c2,#d8c497); }
  .cm-btn:disabled{ opacity:.6; cursor:default; }
</style>
</head>
<body>
<div id="login-panel" class="card" hidden>
  <div class="logo">∞</div>
  <h1>后台管理</h1>
  <p class="sub">请用管理员账号登录</p>
  <div style="height:22px"></div>
  <input id="ad-user" class="inp" placeholder="管理员用户名" autocomplete="username" spellcheck="false">
  <input id="ad-pass" class="inp" type="password" placeholder="密码" autocomplete="current-password">
  <button id="ad-login-btn" class="btn primary">登 录</button>
  <div id="ad-msg" class="msg"></div>
  <a class="back" href="./">← 返回画布首页</a>
</div>

<div id="admin-panel" hidden>
  <header class="bar">
    <div class="brand">无限画布 · 后台管理</div>
    <div class="right"><span id="ad-who"></span><button id="ad-logout" class="btn">退出</button></div>
  </header>
  <section class="card">
    <h2>统计</h2>
    <div class="stats">
      <div class="st"><b id="st-users">0</b><span>用户总数</span></div>
      <div class="st"><b id="st-canvases">0</b><span>画布总数</span></div>
      <div class="st"><b id="st-gens">0</b><span>生成总数（图+视频）</span></div>
      <div class="st"><b id="st-disabled">0</b><span>已禁用账号</span></div>
    </div>
  </section>
  <section class="card">
    <h2>预置账号</h2>
    <div class="row">
      <input id="nu-user" class="inp" placeholder="用户名" spellcheck="false">
      <input id="nu-pass" class="inp" placeholder="初始密码（至少 4 位）">
      <button id="nu-btn" class="btn primary">创建账号</button>
    </div>
  </section>
  <section class="card">
    <h2>用户管理</h2>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>用户名（点击进入详情）</th><th>密码</th><th>状态</th><th>登录次数</th><th>生成图</th><th>生成视频</th><th>画布数</th><th>积分</th><th>操作</th>
        </tr></thead>
        <tbody id="user-tbody"></tbody>
      </table>
    </div>
    <div class="hint">点用户名 → 新标签页打开该用户详细界面。「加积分」直接调整该账号积分（正数加、负数减），积分账本在服务器端。</div>
  </section>
</div>

<!-- 加积分弹窗 -->
<div id="credit-modal" class="cm-mask" hidden>
  <div class="cm-card">
    <div class="cm-head">
      <span class="cm-title">调整积分</span>
      <button class="cm-close" id="cm-close" title="关闭">×</button>
    </div>
    <div class="cm-user">账号：<b id="cm-user"></b></div>
    <label class="cm-label">积分变化（正数加 / 负数减）</label>
    <input id="cm-delta" class="cm-input" type="number" step="0.01" placeholder="例：100 或 -50">
    <div class="cm-err" id="cm-err"></div>
    <div class="cm-actions">
      <button class="cm-btn" id="cm-cancel">取消</button>
      <button class="cm-btn primary" id="cm-ok">确定加积分</button>
    </div>
  </div>
</div>

<script src="js/utils.js?v=20261011d"></script>
<script src="js/cloud.js?v=20261011d"></script>
<script src="js/auth.js?v=20261011d"></script>
<script src="js/admin.js?v=20261011d"></script>
</body>
</html>
